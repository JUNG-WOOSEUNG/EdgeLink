<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 메뉴바 팝오버</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0077B6}a:hover{color:#094B7B}
</style>
</helmet>
<div style="width: 360px; height: 640px; box-sizing: border-box; background: #FFFFFF; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 12px; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px">
    <div style="width: 36px; height: 36px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"></rect><path d="M2 12h4M4 10l2 2-2 2"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <div style="font-size: 15px; font-weight: 700; line-height: 1.2">EdgeLink</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4D4D4D; line-height: 1.3">
        <span style="width: 8px; height: 8px; border-radius: 9999px; background: #28A745"></span>
        <span>iPhone 15 Pro 연결됨</span>
      </div>
    </div>
    <a href="Settings.dc.html" aria-label="설정 열기" style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #4D4D4D">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </a>
  </div>

  <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; color: #4D4D4D">지금 조작 중</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F0F0F2; border-radius: 10px">
      <button onClick="{{pickMac}}" aria-pressed="{{isMac}}" style="{{macStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M1 20h22"></path></svg>
        <span>Mac</span>
      </button>
      <button onClick="{{pickPhone}}" aria-pressed="{{isPhone}}" style="{{phoneStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>
        <span>iPhone</span>
      </button>
    </div>
    <div style="font-size: 12px; color: #4D4D4D; line-height: 1.3">모서리로 밀거나 <span style="font-weight: 600; color: #1A1A1A">⌃⌥⌘Space</span>로 전환해요.</div>
  </div>

  <div style="height: 1px; background: #E5E5E5; margin: 0 16px"></div>

  <div style="padding: 16px; display: flex; align-items: center; gap: 16px">
    <div style="position: relative; width: 112px; height: 64px; flex-shrink: 0">
      <div style="position: absolute; left: 0; top: 18px; width: 44px; height: 30px; border-radius: 3px; background: #E3F2FB; border: 1px solid #8C8C8C"></div>
      <div style="position: absolute; left: 44px; top: 8px; width: 52px; height: 34px; border-radius: 3px; background: #E3F2FB; border: 1px solid #8C8C8C"></div>
      <div style="position: absolute; left: 95px; top: 12px; width: 4px; height: 26px; border-radius: 9999px; background: {{accent}}"></div>
      <div style="position: absolute; left: 100px; top: 10px; width: 12px; height: 26px; border-radius: 3px; background: #1A1A1A"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <div style="font-size: 13px; font-weight: 600; line-height: 1.3">LG UltraFine 오른쪽</div>
      <div style="font-size: 12px; color: #4D4D4D; line-height: 1.3">모니터 2대 · 파란 구간에서 넘어가요</div>
      <a href="Settings.dc.html" style="font-size: 12px; font-weight: 600; text-decoration: none">배치 변경 &gt;</a>
    </div>
  </div>

  <div style="height: 1px; background: #E5E5E5; margin: 0 16px"></div>

  <div style="padding: 8px 16px; display: flex; flex-direction: column">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <label for="{{t.id}}" style="font-size: 13px; font-weight: 600; line-height: 1.3">{{t.label}}</label>
          <div style="font-size: 12px; color: #4D4D4D; line-height: 1.3">{{t.hint}}</div>
        </div>
        <button id="{{t.id}}" onClick="{{t.flip}}" aria-pressed="{{t.on}}" style="{{t.track}}">
          <span style="{{t.knob}}"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="height: 40px; border-radius: 20px; border: 1px solid {{accent}}; background: #FFFFFF; color: #0077B6; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"></rect><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"></path></svg>
      클립보드 보내기
    </button>
    <button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="menu" style="height: 40px; border-radius: 20px; border: 1px solid #CCCCCC; background: #FFFFFF; color: #1A1A1A; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      iPhone 15 Pro
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <sc-if value="{{showMenu}}" hint-placeholder-val="{{ false }}">
    <div role="menu" aria-label="기기 선택" style="position: absolute; right: 16px; bottom: 112px; width: 220px; padding: 6px; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 10px; box-shadow: 0 8px 30px rgba(51,51,51,.16); display: flex; flex-direction: column">
      <button role="menuitem" style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: #E5F4FC; color: #094B7B; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; text-align: left"><span style="width: 14px">✓</span><span style="flex-grow: 1">iPhone 15 Pro</span><span style="font-size: 11.5px; font-weight: 400">연결됨</span></button>
      <button role="menuitem" style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #1A1A1A; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 8px; text-align: left"><span style="width: 14px"></span><span style="flex-grow: 1">iPad Air</span><span style="font-size: 11.5px; color: #4D4D4D">연결</span></button>
      <div style="height: 1px; background: #F0F0F0; margin: 4px 0"></div>
      <button role="menuitem" style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #1A1A1A; font-family: inherit; font-size: 13px; text-align: left">새 기기 페어링…</button>
      <button role="menuitem" onClick="{{toggleMenu}}" style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #1A1A1A; font-family: inherit; font-size: 13px; text-align: left">연결 끊기</button>
    </div>
  </sc-if>

  <div style="margin-top: auto; border-top: 1px solid #E5E5E5; padding: 4px 8px; display: flex; justify-content: space-between">
    <a href="Settings.dc.html" style="height: 36px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1A1A1A; text-decoration: none">설정… <span style="color: #4D4D4D">⌘,</span></a>
    <button style="height: 36px; padding: 0 8px; border: 0; background: transparent; font-family: inherit; font-size: 13px; color: #1A1A1A; display: flex; align-items: center; gap: 8px">EdgeLink 종료 <span style="color: #4D4D4D">⌘Q</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0097E4","options":["#0097E4","#094B7B","#1A1A1A"]},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { target: 'mac', edge: true, glass: true, media: false, menu: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0097E4';
    const s = this.state;
    const seg = (on) => 'height: 36px; border: 0; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; ' +
      (on ? 'background: #FFFFFF; color: #1A1A1A; box-shadow: 0 2px 8px rgba(51,51,51,.16)' : 'background: transparent; color: #4D4D4D');
    const sw = (key, label, hint) => {
      const on = s[key];
      return {
        id: 'tg-' + key, label, hint, on: on ? 'true' : 'false',
        flip: () => this.setState({ [key]: !s[key] }),
        track: 'width: 40px; height: 24px; flex-shrink: 0; border: 0; padding: 2px; border-radius: 9999px; display: flex; ' +
          (on ? 'background: ' + accent + '; justify-content: flex-end' : 'background: #CCCCCC; justify-content: flex-start'),
        knob: 'width: 20px; height: 20px; border-radius: 9999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(51,51,51,.16)'
      };
    };
    return {
      accent,
      isMac: s.target === 'mac' ? 'true' : 'false',
      isPhone: s.target === 'iphone' ? 'true' : 'false',
      macStyle: seg(s.target === 'mac'),
      phoneStyle: seg(s.target === 'iphone'),
      pickMac: () => this.setState({ target: 'mac' }),
      pickPhone: () => this.setState({ target: 'iphone' }),
      showMenu: s.menu, menuOpen: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      toggles: [
        sw('edge', '모서리 전환', '끄면 단축키로만 넘어가요'),
        sw('glass', '모서리 유리 효과', '밀 때 가장자리가 볼록해져요'),
        sw('media', '미디어 키를 아이폰으로', '볼륨·재생 키를 아이폰에 보내요')
      ]
    };
  }
}
</script>
</body>
</html>
