<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 팝오버 연결 전</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0077B6}a:hover{color:#094B7B}
</style>
</helmet>
<div style="width: 360px; height: 480px; box-sizing: border-box; background: #FFFFFF; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 12px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px">
    <div style="width: 36px; height: 36px; border-radius: 8px; background: #E5E5E5; display: flex; align-items: center; justify-content: center; color: #4D4D4D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"></rect><path d="M3 3l18 18"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <div style="font-size: 15px; font-weight: 700; line-height: 1.2">EdgeLink</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4D4D4D; line-height: 1.3">
        <span style="width: 8px; height: 8px; border-radius: 9999px; background: #8C8C8C"></span>
        <span>{{status}}</span>
      </div>
    </div>
  </div>

  <sc-if value="{{isSetup}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 18px; font-weight: 700; line-height: 1.2">설정이 조금 남았어요</div>
        <div style="font-size: 13px; color: #4D4D4D; line-height: 1.4">멈춘 곳부터 이어서 하면 돼요.</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 10px; border: 1px solid #0097E4; background: #F2FAFE">
        <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 700; color: #094B7B">다음: 아이폰 페어링</span><span style="color: #4D4D4D">3 / 8단계</span></div>
        <div style="height: 6px; border-radius: 9999px; background: #DCEFFA" aria-hidden="true"><div style="width: 37%; height: 6px; border-radius: 9999px; background: #0097E4"></div></div>
        <a href="Onboarding-3-Pairing.dc.html" style="height: 38px; border-radius: 20px; background: #0077B6; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">설정 이어하기</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4D4D4D">
        <div style="display: flex; align-items: center; gap: 8px"><span style="color: #1E7E34; font-weight: 700">✓</span>Mac 권한 3가지</div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; margin: 0 3px; border-radius: 9999px; border: 1.5px solid #8C8C8C"></span>아이폰 연결 · 배치 · 연습</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isDisconnected}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 10px; border: 1px solid #E5E5E5">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect></svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 14px; font-weight: 700">iPhone 15 Pro</div>
            <div style="font-size: 12px; color: #4D4D4D">기본 기기 · 3분 전에 끊겼어요</div>
          </div>
        </div>
        <button style="height: 38px; border: 0; border-radius: 20px; background: #0077B6; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">다시 연결</button>
        <div style="font-size: 12px; color: #4D4D4D; line-height: 1.4">아이폰 블루투스가 꺼져 있거나 멀리 있을 수 있어요. 1분 뒤에 자동으로 다시 시도해요.</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; font-weight: 600; color: #4D4D4D">다른 기기</div>
        <button style="height: 44px; padding: 0 12px; border: 1px solid #E5E5E5; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1A1A1A; display: flex; align-items: center; gap: 10px; text-align: left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2.5"></rect></svg>
          <span style="flex-grow: 1">iPad Air</span>
          <span style="font-size: 12px; font-weight: 600; color: #0077B6">연결</span>
        </button>
        <a href="Onboarding-3-Pairing.dc.html" style="font-size: 12px; font-weight: 600; text-decoration: none; padding: 4px 0">+ 새 기기 페어링</a>
      </div>
    </div>
  </sc-if>

  <div style="margin-top: auto; border-top: 1px solid #E5E5E5; padding: 4px 8px; display: flex; justify-content: space-between">
    <a href="Settings.dc.html" style="height: 36px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1A1A1A; text-decoration: none">설정… <span style="color: #4D4D4D">⌘,</span></a>
    <button style="height: 36px; padding: 0 8px; border: 0; background: transparent; font-family: inherit; font-size: 13px; color: #1A1A1A; display: flex; align-items: center; gap: 8px">EdgeLink 종료 <span style="color: #4D4D4D">⌘Q</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["setup","disconnected"],"default":"setup"},"$preview":{"width":360,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'setup';
    return {
      isSetup: st === 'setup', isDisconnected: st === 'disconnected',
      status: st === 'setup' ? '설정 중 · 연결된 기기 없음' : '연결 끊김'
    };
  }
}
</script>
</body>
</html>
