<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 시작하기 · 환영</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0077B6}a:hover{color:#094B7B}
</style>
</helmet>
<div style="width: 720px; height: 560px; box-sizing: border-box; background: #FFFFFF; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 12px; overflow: hidden">
  <div style="height: 44px; display: flex; align-items: center; padding: 0 16px; gap: 8px" aria-hidden="true">
    <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FF5F57"></span>
    <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FEBC2E"></span>
    <span style="width: 12px; height: 12px; border-radius: 9999px; background: #D9D9D9"></span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 0 64px; text-align: center">
    <div style="position: relative; width: 300px; height: 150px" aria-hidden="true">
      <div style="position: absolute; left: 20px; top: 10px; width: 200px; height: 126px; border-radius: 10px; background: #1A1A1A; padding: 6px; box-sizing: border-box">
        <div style="width: 100%; height: 100%; border-radius: 5px; background: #E3F2FB"></div>
      </div>
      <div style="position: absolute; left: 0; top: 136px; width: 240px; height: 8px; border-radius: 0 0 8px 8px; background: #B3B3B3"></div>
      <div style="position: absolute; left: 206px; top: 40px; width: 20px; height: 64px; border-radius: 9999px; background: rgba(0,151,228,0.28); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 0 16px rgba(0,151,228,0.5)"></div>
      <div style="position: absolute; left: 246px; top: 26px; width: 52px; height: 104px; border-radius: 12px; background: #1A1A1A; padding: 4px; box-sizing: border-box">
        <div style="width: 100%; height: 100%; border-radius: 9px; background: #2B2B2B; display: flex; align-items: center; justify-content: center">
          <span style="width: 10px; height: 10px; border-radius: 9999px; border: 2px solid #FFFFFF; box-sizing: border-box"></span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.2">Mac 키보드 하나로 아이폰까지</h1>
      <p style="margin: 0; font-size: 15px; color: #4D4D4D; line-height: 1.4">커서를 화면 끝으로 밀면 아이폰으로 넘어가요.<br>아이폰엔 아무것도 설치하지 않아요.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 8px; background: #F5F5F7; text-align: left">
        <div style="font-size: 13px; font-weight: 700">권한 3가지</div>
        <div style="font-size: 12px; color: #4D4D4D; line-height: 1.3">입력을 아이폰으로 보내는 데 필요해요</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 8px; background: #F5F5F7; text-align: left">
        <div style="font-size: 13px; font-weight: 700">아이폰 연결</div>
        <div style="font-size: 12px; color: #4D4D4D; line-height: 1.3">블루투스 페어링 한 번이면 돼요</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 8px; background: #F5F5F7; text-align: left">
        <div style="font-size: 13px; font-weight: 700">배치와 연습</div>
        <div style="font-size: 12px; color: #4D4D4D; line-height: 1.3">아이폰 위치를 정하고 직접 넘어가봐요</div>
      </div>
    </div>
  </div>

  <div style="height: 72px; border-top: 1px solid #E5E5E5; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
    <span style="font-size: 12px; color: #4D4D4D">약 3분 걸려요</span>
    <a href="Onboarding-2-Permissions.dc.html" style="height: 40px; padding: 0 28px; border-radius: 20px; background: #0077B6; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center">시작하기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0097E4","options":["#0097E4","#094B7B","#1A1A1A"]},"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0097E4' };
  }
}
</script>
</body>
</html>
