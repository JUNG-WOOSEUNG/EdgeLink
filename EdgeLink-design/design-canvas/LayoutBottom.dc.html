<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 배치 · 모니터 아래</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0077B6}a:hover{color:#094B7B}
</style>
</helmet>
<div style="width: 860px; height: 640px; box-sizing: border-box; background: #FFFFFF; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; display: flex; border: 1px solid #E5E5E5; border-radius: 12px; overflow: hidden">

  <div style="width: 200px; flex-shrink: 0; background: #F5F5F7; border-right: 1px solid #E5E5E5; display: flex; flex-direction: column">
    <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 9999px; background: #28C840"></span>
    </div>
    <nav aria-label="설정 메뉴" style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px">
      <button style="height: 36px; border: 0; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; font-weight: 600; background: transparent; color: #1A1A1A"><span style="width: 20px; height: 20px; border-radius: 5px; background: #8C8C8C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">G</span>일반</button>
      <button aria-current="page" style="height: 36px; border: 0; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; font-weight: 600; background: #DCEFFA; color: #094B7B"><span style="width: 20px; height: 20px; border-radius: 5px; background: #0077B6; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">L</span>배치</button>
      <button style="height: 36px; border: 0; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; font-weight: 600; background: transparent; color: #1A1A1A"><span style="width: 20px; height: 20px; border-radius: 5px; background: #8C8C8C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">I</span>입력</button>
      <button style="height: 36px; border: 0; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; font-weight: 600; background: transparent; color: #1A1A1A"><span style="width: 20px; height: 20px; border-radius: 5px; background: #8C8C8C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">C</span>연결</button>
      <button style="height: 36px; border: 0; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; font-weight: 600; background: transparent; color: #1A1A1A"><span style="width: 20px; height: 20px; border-radius: 5px; background: #8C8C8C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">i</span>정보</button>
    </nav>
  </div>

  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
    <div style="height: 52px; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid #E5E5E5; font-size: 15px; font-weight: 700">배치</div>
    <div style="padding: 24px 32px; display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 13px; color: #4D4D4D; line-height: 1.3">아이폰을 실제로 놓은 쪽 모니터 가장자리로 끌어다 놓으세요. 놓을 수 있는 곳이 파란 선으로 표시돼요.</div>

      <div style="position: relative; height: 280px; border-radius: 8px; background: #F5F5F7; border: 1px solid #E5E5E5; overflow: hidden">
        <div style="position: absolute; left: 60px; top: 92px; width: 150px; height: 96px; border-radius: 5px; background: #E3F2FB; border: 1px solid #8C8C8C; display: flex; flex-direction: column; overflow: hidden">
          <div style="height: 5px; background: #4D4D4D"></div>
          <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">MacBook Pro</div>
        </div>
        <div style="position: absolute; left: 210px; top: 28px; width: 270px; height: 152px; border-radius: 5px; background: #E3F2FB; border: 1px solid #8C8C8C; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">LG UltraFine</div>
        <div style="position: absolute; left: 300px; top: 166px; width: 90px; height: 10px; border-radius: 4px; background: #FFFFFF; border: 1px solid #8C8C8C; display: flex; align-items: center; justify-content: center; gap: 3px">
          <span style="width: 5px; height: 5px; border-radius: 2px; background: #0097E4"></span>
          <span style="width: 5px; height: 5px; border-radius: 2px; background: #28A745"></span>
          <span style="width: 5px; height: 5px; border-radius: 2px; background: #FFC107"></span>
          <span style="width: 5px; height: 5px; border-radius: 2px; background: #8C8C8C"></span>
          <span style="width: 5px; height: 5px; border-radius: 2px; background: #094B7B"></span>
        </div>
        <div style="position: absolute; left: 286px; top: 199px; width: 3px; height: 3px"></div>
        <div style="position: absolute; left: 226px; top: 178px; width: 240px; height: 3px; border-radius: 9999px; background: #B3DDF5"></div>
        <div style="position: absolute; left: 74px; top: 187px; width: 120px; height: 3px; border-radius: 9999px; background: #B3DDF5"></div>
        <div style="position: absolute; left: 352px; top: 177px; width: 86px; height: 5px; border-radius: 9999px; background: {{accent}}; box-shadow: 0 0 8px {{accent}}"></div>
        <div style="position: absolute; left: 368px; top: 186px; width: 54px; height: 86px; border-radius: 12px 12px 0 0; background: #1A1A1A; border: 1.5px solid {{accent}}; border-bottom: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; box-sizing: border-box">
          <span style="width: 18px; height: 5px; border-radius: 9999px; background: #000000"></span>
        </div>
        <div style="position: absolute; left: 432px; top: 196px; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #4D4D4D; line-height: 1.3">
          <span>아래로 밀면 아이폰 위쪽으로 들어가요</span>
          <span>위로 밀면 Mac으로 돌아와요</span>
        </div>
        <div style="position: absolute; left: 216px; top: 172px; width: 12px; height: 12px; border-radius: 9999px; border: 1.5px dashed #8C8C8C; box-sizing: border-box" aria-hidden="true"></div>
        <div style="position: absolute; left: 462px; top: 172px; width: 12px; height: 12px; border-radius: 9999px; border: 1.5px dashed #8C8C8C; box-sizing: border-box" aria-hidden="true"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 9999px; background: #28A745"></span>
        <span>모니터 2대 · 아이폰: <span style="font-weight: 600">LG UltraFine 아래</span> · 꼭짓점 근처(점선)는 핫 코너와 겹치지 않게 비워둬요</span>
      </div>

      <div style="display: flex; gap: 12px; padding: 12px 16px; border-radius: 8px; background: #FFF6E0; border: 1px solid #FFC107">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A4B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
          <div style="font-size: 13px; font-weight: 600; color: #5C3900; line-height: 1.3">Dock과 같은 쪽이에요</div>
          <div style="font-size: 12px; color: #5C3900; line-height: 1.3">밀 때 Dock이 먼저 나타날 수 있어서, 이 위치는 조금 더 길게 밀어야 넘어가요. 넘어가는 순간 Dock은 바로 닫혀요.</div>
          <div style="display: flex; gap: 8px">
            <button style="height: 32px; padding: 0 14px; border-radius: 20px; border: 1px solid #7A4B00; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; color: #5C3900">Dock 위치 설정 열기</button>
            <button style="height: 32px; padding: 0 14px; border-radius: 20px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #5C3900">이대로 쓸게요</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0097E4","options":["#0097E4","#094B7B","#1A1A1A"]},"$preview":{"width":860,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0097E4' };
  }
}
</script>
</body>
</html>
