<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 시작하기 · 연습</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0077B6}a:hover{color:#094B7B}
</style>
</helmet>
<div style="width: 720px; height: 560px; box-sizing: border-box; background: #FFFFFF; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 12px; overflow: hidden">
  <div style="height: 44px; display: flex; align-items: center; padding: 0 16px; gap: 8px" aria-hidden="true">
    <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FF5F57"></span>
    <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FEBC2E"></span>
    <span style="width: 12px; height: 12px; border-radius: 9999px; background: #D9D9D9"></span>
  </div>
  <div style="display: flex; justify-content: center; gap: 8px; padding: 0 0 16px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{s.color}}">
        <span style="{{s.dot}}">{{s.mark}}</span>{{s.label}}<span style="{{s.line}}"></span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; padding: 8px 48px 0; display: flex; gap: 32px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 800">직접 넘어가볼까요?</h1>
        <p style="margin: 0; font-size: 13px; color: #4D4D4D; line-height: 1.4">하나씩 해보면 자동으로 체크돼요. 이 창은 그대로 두고 해보세요.</p>
      </div>

      <div style="display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 8px">
        <sc-for list="{{missions}}" as="m" hint-placeholder-count="3">
          <button onClick="{{m.tick}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; border-bottom: 1px solid #F0F0F0; background: transparent; font-family: inherit; text-align: left; color: #1A1A1A">
            <span style="{{m.dot}}">{{m.mark}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 700">{{m.title}}</span>
              <span style="font-size: 12px; color: #4D4D4D">{{m.hint}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; background: #F5F5F7">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <div style="font-size: 12px; font-weight: 700">돌아오는 위치가 어긋나나요?</div>
          <div style="font-size: 12px; color: #4D4D4D">보정 도우미로 30초면 맞춰져요.</div>
        </div>
        <button style="height: 34px; padding: 0 16px; border-radius: 20px; border: 1px solid {{accent}}; background: #FFFFFF; color: #0077B6; font-family: inherit; font-size: 13px; font-weight: 700">보정 도우미</button>
      </div>
    </div>

    <div style="width: 200px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px" aria-hidden="true">
      <div style="position: relative; width: 200px; height: 200px">
        <div style="position: absolute; left: 0; top: 30px; width: 120px; height: 140px; border-radius: 6px; background: #E3F2FB; border: 1px solid #8C8C8C"></div>
        <div style="position: absolute; left: 108px; top: 60px; width: 24px; height: 80px; border-radius: 9999px; background: rgba(0,151,228,0.25); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 0 14px rgba(0,151,228,0.55)"></div>
        <div style="position: absolute; left: 64px; top: 96px; width: 38px; height: 2px; background: {{accent}}"></div>
        <div style="position: absolute; left: 96px; top: 91px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid {{accent}}"></div>
        <div style="position: absolute; left: 144px; top: 44px; width: 56px; height: 112px; border-radius: 12px; background: #1A1A1A"></div>
      </div>
      <div style="font-size: 12px; color: #4D4D4D; text-align: center; line-height: 1.4">파란 구간에서 바깥쪽으로<br>꾹 밀어보세요</div>
    </div>
  </div>

  <div style="height: 72px; border-top: 1px solid #E5E5E5; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
    <a href="Onboarding-6-Layout.dc.html" style="font-size: 13px; font-weight: 600; color: #1A1A1A; text-decoration: none">이전</a>
    <div style="display: flex; align-items: center; gap: 16px">
      <a href="Onboarding-8-Done.dc.html" style="font-size: 13px; font-weight: 600; color: #4D4D4D; text-decoration: none">건너뛰기</a>
      <a href="Onboarding-8-Done.dc.html" style="{{nextStyle}}">다음</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0097E4","options":["#0097E4","#094B7B","#1A1A1A"]},"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { go: true, back: false, key: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0097E4';
    const s = this.state;
    const stepDefs = ['Mac 권한', '아이폰 연결', '배치', '연습'];
    const current = 3;
    const steps = stepDefs.map((label, i) => {
      const done = i < current, on = i === current;
      return {
        label, mark: done ? '✓' : String(i + 1),
        color: on ? '#1A1A1A' : '#4D4D4D',
        dot: 'width: 20px; height: 20px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; ' +
          (done ? 'background: #28A745; color: #FFFFFF' : on ? 'background: #0077B6; color: #FFFFFF' : 'border: 1px solid #8C8C8C; color: #4D4D4D; box-sizing: border-box'),
        line: i < stepDefs.length - 1 ? 'width: 28px; height: 1px; background: #CCCCCC; margin-left: 4px' : 'display: none'
      };
    });
    const defs = [
      { key: 'go', title: '아이폰으로 넘어가기', hint: 'LG UltraFine 오른쪽 끝에서 커서를 꾹 밀어요' },
      { key: 'back', title: 'Mac으로 돌아오기', hint: '아이폰 화면 왼쪽 끝으로 커서를 꾹 밀어요' },
      { key: 'key', title: '단축키로 전환하기', hint: '⌃⌥⌘Space를 눌러요. 어디서든 바로 넘어가요' }
    ];
    const missions = defs.map((d, i) => {
      const done = s[d.key];
      return {
        ...d, mark: done ? '✓' : String(i + 1),
        tick: () => this.setState({ [d.key]: !s[d.key] }),
        dot: 'width: 26px; height: 26px; flex-shrink: 0; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; ' +
          (done ? 'background: #28A745; color: #FFFFFF' : 'border: 1.5px solid #8C8C8C; color: #4D4D4D; box-sizing: border-box')
      };
    });
    const all = s.go && s.back && s.key;
    return {
      accent, steps, missions,
      nextStyle: 'height: 40px; padding: 0 28px; border-radius: 20px; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; ' +
        (all ? 'background: #0077B6; color: #FFFFFF' : 'background: #E5E5E5; color: #4D4D4D; pointer-events: none')
    };
  }
}
</script>
</body>
</html>
