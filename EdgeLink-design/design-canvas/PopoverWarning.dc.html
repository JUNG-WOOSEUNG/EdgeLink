<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 팝오버 문제 있음</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0077B6}a:hover{color:#094B7B}
</style>
</helmet>
<div style="width: 360px; height: 640px; box-sizing: border-box; background: #FFFFFF; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1A1A1A; display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 12px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px">
    <div style="position: relative; width: 36px; height: 36px; border-radius: 8px; background: #E5E5E5; display: flex; align-items: center; justify-content: center; color: #4D4D4D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"></rect></svg>
      <span style="position: absolute; right: -3px; top: -3px; width: 12px; height: 12px; border-radius: 9999px; background: #FF9500; border: 2px solid #FFFFFF; box-sizing: border-box"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <div style="font-size: 15px; font-weight: 700; line-height: 1.2">EdgeLink</div>
      <div style="font-size: 12px; color: #8A4B00; font-weight: 600; line-height: 1.3">{{status}}</div>
    </div>
  </div>

  <div style="padding: 0 16px 16px">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 10px; background: #FFF6E0; border: 1px solid #FFC107">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A4B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 14px; font-weight: 700; color: #5C3900">{{title}}</div>
          <div style="font-size: 12px; color: #5C3900; line-height: 1.4">{{body}}</div>
        </div>
      </div>
      <button style="height: 38px; border: 0; border-radius: 20px; background: #0077B6; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">{{cta}}</button>
      <div style="font-size: 11.5px; color: #5C3900; line-height: 1.4">{{hint}}</div>
    </div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; color: #4D4D4D">지금 쓸 수 없는 기능</div>
    <div style="display: flex; flex-direction: column; border: 1px solid #E5E5E5; border-radius: 8px; padding: 0 12px; color: #8C8C8C">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px solid #F0F0F0; font-size: 13px"><span>아이폰으로 전환</span><span style="font-size: 12px">멈춤</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px solid #F0F0F0; font-size: 13px"><span>모서리 전환</span><span style="font-size: 12px">멈춤</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; font-size: 13px"><span>클립보드 보내기</span><span style="font-size: 12px">멈춤</span></div>
    </div>
    <div style="font-size: 12px; color: #4D4D4D; line-height: 1.4">해결되면 자동으로 다시 동작해요. 앱을 다시 켤 필요는 없어요.</div>
  </div>

  <div style="margin-top: auto; border-top: 1px solid #E5E5E5; padding: 4px 8px; display: flex; justify-content: space-between">
    <a href="Settings.dc.html" style="height: 36px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1A1A1A; text-decoration: none">설정… <span style="color: #4D4D4D">⌘,</span></a>
    <button style="height: 36px; padding: 0 8px; border: 0; background: transparent; font-family: inherit; font-size: 13px; color: #1A1A1A; display: flex; align-items: center; gap: 8px">EdgeLink 종료 <span style="color: #4D4D4D">⌘Q</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"issue":{"editor":"enum","options":["permission","bluetooth","mdm"],"default":"permission"},"accent":{"editor":"color","default":"#0097E4","options":["#0097E4","#094B7B","#1A1A1A"]},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0097E4';
    const issue = this.props.issue ?? 'permission';
    const copy = {
      permission: {
        status: '권한이 꺼져 있어요',
        title: '손쉬운 사용 권한이 꺼졌어요',
        body: '이 권한이 없으면 아이폰 조작 중에도 입력이 Mac으로 가요. 그래서 전환을 멈췄어요.',
        cta: '시스템 설정에서 다시 켜기',
        hint: '목록에서 EdgeLink를 켜주세요. 켜면 1초 안에 다시 동작해요.'
      },
      bluetooth: {
        status: 'Mac 블루투스가 꺼져 있어요',
        title: 'Mac 블루투스가 꺼져 있어요',
        body: '블루투스가 켜져야 아이폰에 키보드·마우스로 연결할 수 있어요. 다시 연결 시도도 멈췄어요.',
        cta: '블루투스 설정 열기',
        hint: '켜면 기본 기기(iPhone 15 Pro)에 자동으로 다시 연결해요.'
      },
      mdm: {
        status: '권한을 켤 수 없어요',
        title: '회사 정책으로 막혀 있을 수 있어요',
        body: '1분이 지나도 권한이 켜지지 않았어요. 회사에서 관리하는 Mac이라면 관리자가 막아둔 걸 수 있어요.',
        cta: '관리자에게 보낼 내용 복사',
        hint: '복사되는 내용: 앱 이름, 번들 ID, 필요한 권한 3가지와 이유.'
      }
    };
    return { accent, ...copy[issue] };
  }
}
</script>
</body>
</html>
