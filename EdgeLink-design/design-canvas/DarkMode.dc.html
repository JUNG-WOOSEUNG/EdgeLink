<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EdgeLink 다크 모드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5CC0F5}a:hover{color:#8FD4F8}
</style>
</helmet>
<div style="width: 1260px; height: 700px; box-sizing: border-box; padding: 30px; background: #111214; font-family: SUIT, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #F2F2F2; display: flex; gap: 40px; border-radius: 12px">

  <div style="width: 360px; height: 640px; flex-shrink: 0; box-sizing: border-box; background: #2A2A2C; border: 1px solid #3A3A3C; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px">
      <div style="width: 36px; height: 36px; border-radius: 8px; background: #0077B6; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"></rect><path d="M2 12h4M4 10l2 2-2 2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <div style="font-size: 15px; font-weight: 700">EdgeLink</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ABABAB"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #4CD07D"></span>iPhone 15 Pro 연결됨</div>
      </div>
      <button aria-label="설정 열기" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #ABABAB; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle></svg>
      </button>
    </div>
    <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #ABABAB">지금 조작 중</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #1E1E20; border-radius: 10px">
        <button style="height: 36px; border: 0; border-radius: 7px; background: #48484A; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Mac</button>
        <button style="height: 36px; border: 0; border-radius: 7px; background: transparent; color: #ABABAB; font-family: inherit; font-size: 13px; font-weight: 600">iPhone</button>
      </div>
      <div style="font-size: 12px; color: #ABABAB">모서리로 밀거나 <span style="font-weight: 600; color: #F2F2F2">⌃⌥⌘Space</span>로 전환해요.</div>
    </div>
    <div style="height: 1px; background: #333336; margin: 0 16px"></div>
    <div style="padding: 16px; display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: 112px; height: 64px; flex-shrink: 0" aria-hidden="true">
        <div style="position: absolute; left: 0; top: 18px; width: 44px; height: 30px; border-radius: 3px; background: #1F3A4D; border: 1px solid #6E6E73"></div>
        <div style="position: absolute; left: 44px; top: 8px; width: 52px; height: 34px; border-radius: 3px; background: #1F3A4D; border: 1px solid #6E6E73"></div>
        <div style="position: absolute; left: 95px; top: 12px; width: 4px; height: 26px; border-radius: 9999px; background: #2EA8F0"></div>
        <div style="position: absolute; left: 100px; top: 10px; width: 12px; height: 26px; border-radius: 3px; background: #F2F2F2"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; font-weight: 600">LG UltraFine 오른쪽</div>
        <div style="font-size: 12px; color: #ABABAB">모니터 2대 · 파란 구간에서 넘어가요</div>
        <a href="Settings.dc.html" style="font-size: 12px; font-weight: 600; text-decoration: none">배치 변경 &gt;</a>
      </div>
    </div>
    <div style="height: 1px; background: #333336; margin: 0 16px"></div>
    <div style="padding: 8px 16px; display: flex; flex-direction: column">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <div style="font-size: 13px; font-weight: 600">{{t.label}}</div>
            <div style="font-size: 12px; color: #ABABAB">{{t.hint}}</div>
          </div>
          <span style="{{t.track}}"><span style="width: 20px; height: 20px; border-radius: 9999px; background: #FFFFFF"></span></span>
        </div>
      </sc-for>
    </div>
    <div style="padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 40px; border-radius: 20px; border: 1px solid #2EA8F0; background: transparent; color: #5CC0F5; font-family: inherit; font-size: 13px; font-weight: 600">클립보드 보내기</button>
      <button style="height: 40px; border-radius: 20px; border: 1px solid #545458; background: transparent; color: #F2F2F2; font-family: inherit; font-size: 13px; font-weight: 600">iPhone 15 Pro</button>
    </div>
    <div style="margin-top: auto; border-top: 1px solid #333336; padding: 4px 16px; height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 13px">
      <span>설정… <span style="color: #ABABAB">⌘,</span></span><span>EdgeLink 종료 <span style="color: #ABABAB">⌘Q</span></span>
    </div>
  </div>

  <div style="width: 800px; height: 640px; box-sizing: border-box; background: #1E1E1E; border: 1px solid #3A3A3C; border-radius: 12px; overflow: hidden; display: flex">
    <div style="width: 190px; flex-shrink: 0; background: #252527; border-right: 1px solid #333336; display: flex; flex-direction: column">
      <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px" aria-hidden="true">
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FF5F57"></span>
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: #FEBC2E"></span>
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: #28C840"></span>
      </div>
      <nav aria-label="설정 메뉴" style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <button style="{{t.style}}"><span style="{{t.box}}">{{t.short}}</span>{{t.label}}</button>
        </sc-for>
      </nav>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <div style="height: 52px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid #333336; font-size: 15px; font-weight: 700">일반</div>
      <div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; border: 1px solid #3A3A3C; border-radius: 8px; padding: 0 16px; background: #252527">
          <sc-for list="{{general}}" as="t" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #333336">
              <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
                <div style="font-size: 14px; font-weight: 600">{{t.label}}</div>
                <div style="font-size: 12px; color: #ABABAB">{{t.hint}}</div>
              </div>
              <span style="{{t.track}}"><span style="width: 20px; height: 20px; border-radius: 9999px; background: #FFFFFF"></span></span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; border: 1px solid #3A3A3C; border-radius: 8px; padding: 16px; background: #252527">
          <div style="font-size: 14px; font-weight: 600">전환 감도</div>
          <div style="font-size: 12px; color: #ABABAB">모서리를 얼마나 밀어야 아이폰으로 넘어갈지 정해요.</div>
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="font-size: 12px; color: #ABABAB">살짝</span>
            <div style="position: relative; flex-grow: 1; height: 4px; border-radius: 9999px; background: #48484A" aria-hidden="true">
              <div style="width: 55%; height: 4px; border-radius: 9999px; background: #2EA8F0"></div>
              <span style="position: absolute; left: 55%; top: -8px; width: 20px; height: 20px; margin-left: -10px; border-radius: 9999px; background: #FFFFFF"></span>
            </div>
            <span style="font-size: 12px; color: #ABABAB">꾹</span>
          </div>
        </div>
        <div style="display: flex; gap: 10px; padding: 12px 16px; border-radius: 8px; background: #3A2E12; border: 1px solid #8A6A1F">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5D48A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 13px; font-weight: 700; color: #F5D48A">안내 카드 (다크)</div>
            <div style="font-size: 12px; color: #EBDDB8">주의가 필요한 안내는 어두운 황토색 바탕에 밝은 노랑 글자로 보여줘요.</div>
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <button style="height: 36px; padding: 0 18px; border: 0; border-radius: 20px; background: #0077B6; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">주 버튼</button>
          <button style="height: 36px; padding: 0 18px; border-radius: 20px; border: 1px solid #2EA8F0; background: transparent; color: #5CC0F5; font-family: inherit; font-size: 13px; font-weight: 600">보조 버튼</button>
          <button style="height: 36px; padding: 0 18px; border-radius: 20px; border: 1px solid #545458; background: transparent; color: #F2F2F2; font-family: inherit; font-size: 13px; font-weight: 600">일반 버튼</button>
          <button style="height: 36px; padding: 0 18px; border-radius: 20px; border: 1px solid #FF6B6B; background: transparent; color: #FF8A8A; font-family: inherit; font-size: 13px; font-weight: 600">페어링 초기화</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1260,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const track = (on) => 'width: 40px; height: 24px; flex-shrink: 0; box-sizing: border-box; padding: 2px; border-radius: 9999px; display: flex; ' +
      (on ? 'background: #2EA8F0; justify-content: flex-end' : 'background: #48484A; justify-content: flex-start');
    const tabDefs = [['G', '일반', true], ['L', '배치', false], ['I', '입력', false], ['C', '연결', false], ['i', '정보', false]];
    return {
      toggles: [
        { label: '모서리 전환', hint: '끄면 단축키로만 넘어가요', track: track(true) },
        { label: '모서리 유리 효과', hint: '밀 때 가장자리가 볼록해져요', track: track(true) },
        { label: '미디어 키를 아이폰으로', hint: '볼륨·재생 키를 아이폰에 보내요', track: track(false) }
      ],
      general: [
        { label: '로그인할 때 자동 실행', hint: 'Mac을 켜면 바로 아이폰과 연결돼요', track: track(true) },
        { label: '모서리 유리 효과', hint: '밀 때 가장자리가 볼록하게 부풀어요', track: track(true) },
        { label: '전환할 때 소리', hint: '넘어가고 돌아올 때 짧은 효과음을 내요', track: track(false) }
      ],
      tabs: tabDefs.map(([short, label, on]) => ({
        short, label,
        style: 'height: 36px; border: 0; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13px; font-weight: 600; ' +
          (on ? 'background: rgba(46,168,240,0.18); color: #8FD4F8' : 'background: transparent; color: #F2F2F2'),
        box: 'width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #FFFFFF; background: ' + (on ? '#0077B6' : '#636366')
      }))
    };
  }
}
</script>
</body>
</html>
